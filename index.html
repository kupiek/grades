<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>Мобильный журнал — оценки</title>
<script>
// Применяем тему до отрисовки страницы, чтобы не было вспышки стандартного оформления.
(() => {
  const names = ['default', 'win98', 'business'];
  let saved = 'default';
  try { saved = localStorage.getItem('mobile-journal-theme-v1') || 'default'; } catch (_) {}
  const chosen = names.includes(saved) ? saved : 'default';
  document.documentElement.dataset.theme = chosen;
  document.querySelector('meta[name="theme-color"]').content =
    chosen === 'win98' ? '#000080' : chosen === 'business' ? '#ffffff' : '#0b0e14';
})();
</script>
<style>
:root{
  --bg:#0b0e14; --card:#141926; --card-2:#1a2032; --border:#252d44;
  --text:#e9edf5; --muted:#8a93a8;
  --accent:#00ff88; --accent-soft:rgba(0,255,136,.12);
  --blue:#00d4ff; --yellow:#ffd60a; --red:#ff453a; --purple:#bf5af2; --orange:#ff9f0a;
  color-scheme: dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--text);
  padding-bottom:calc(110px + env(safe-area-inset-bottom));
}
header{
  position:sticky;top:0;z-index:30;
  background:rgba(11,14,20,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
}
.header-row{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto}
.header-title{font-size:17px;font-weight:800}
.header-sub{font-size:12px;color:var(--muted);margin-top:2px}
main{padding:14px 14px 20px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px}
.screen-title{font-size:20px;font-weight:900;margin:4px 0 2px}
.screen-title.small{font-size:17px}
.icon-btn{
  border:1px solid var(--border);background:var(--card);color:var(--text);
  width:40px;height:40px;border-radius:12px;font-size:17px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.icon-btn:active{border-color:var(--accent)}
/* ---- поиск / списки ---- */
.search{
  width:100%;height:46px;border-radius:12px;border:1px solid var(--border);
  background:var(--card);color:var(--text);font-size:16px;padding:0 14px;margin-top:10px;
}
.search:focus,.select:focus{outline:none;border-color:var(--accent)}
.list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.list-item{padding:14px 16px;cursor:pointer;transition:border-color .15s;display:flex;align-items:center;gap:10px}
.list-item:active{border-color:var(--accent)}
.li-name{font-size:15px;font-weight:800}
.li-sub{font-size:12px;color:var(--muted);margin-top:3px}
.chev{color:var(--muted);font-size:24px;line-height:1;flex-shrink:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.seg button{
  height:42px;border-radius:12px;border:1px solid var(--border);
  background:var(--card-2);color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;
}
.seg button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
/* ---- шапка группы/студента ---- */
.group-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.badge{font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px;border:1px solid;flex-shrink:0}
.b1{color:var(--blue);border-color:rgba(0,212,255,.4);background:rgba(0,212,255,.1)}
.b2{color:var(--purple);border-color:rgba(191,90,242,.4);background:rgba(191,90,242,.1)}
.b0{color:var(--muted);border-color:var(--border);background:transparent}
/* ---- статистика студента ---- */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat-mini{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:9px 6px;text-align:center}
.stat-mini .v{font-size:16px;font-weight:900}
.stat-mini .k{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
/* ---- карточка занятия ---- */
.students{display:flex;flex-direction:column;gap:10px}
.student{padding:12px 14px}
.student-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lesson-date{font-size:15px;font-weight:800;flex:1}
.tb{font-size:12px;font-weight:800;padding:4px 10px;border-radius:8px;border:1px solid;flex-shrink:0}
.t-G {color:var(--accent);border-color:rgba(0,255,136,.4);background:rgba(0,255,136,.1)}
.t-P1{color:var(--blue);border-color:rgba(0,212,255,.4);background:rgba(0,212,255,.1)}
.t-P2{color:var(--purple);border-color:rgba(191,90,242,.4);background:rgba(191,90,242,.1)}
.t-IN{color:var(--orange);border-color:rgba(255,159,10,.4);background:rgba(255,159,10,.1)}
.t-X {color:var(--muted);border-color:var(--border);background:transparent}
.chip{font-size:11px;color:var(--muted);background:var(--card-2);border:1px solid var(--border);padding:3px 8px;border-radius:8px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.grade-btn{
  height:48px;border-radius:12px;font-size:18px;font-weight:800;
  border:1.5px solid var(--border);background:var(--card-2);color:var(--muted);
  cursor:pointer;transition:transform .06s ease,background .15s,color .15s,border-color .15s;
}
.grade-btn:active{transform:scale(.94)}
.grade-btn.g5.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);box-shadow:0 0 14px rgba(0,255,136,.25)}
.grade-btn.g4.active{background:rgba(0,212,255,.12);border-color:var(--blue);color:var(--blue)}
.grade-btn.g3.active{background:rgba(255,214,10,.12);border-color:var(--yellow);color:var(--yellow)}
.grade-btn.g2.active{background:rgba(255,69,58,.12);border-color:var(--red);color:var(--red)}
/* ---- панель отправки ---- */
#sendbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:rgba(11,14,20,.95);backdrop-filter:blur(12px);
  border-top:1px solid var(--border);
  padding:10px 16px calc(12px + env(safe-area-inset-bottom));
  display:none;flex-direction:column;gap:6px;align-items:stretch;
}
.send-info{font-size:12px;color:var(--muted);text-align:center}
#send-btn{
  width:100%;max-width:720px;margin:0 auto;height:52px;border-radius:14px;border:none;
  background:linear-gradient(135deg,#00ff88,#00cc6a);color:#06130c;
  font-size:16px;font-weight:800;cursor:pointer;
}
#send-btn:disabled{opacity:.35}
/* ---- служебное ---- */
#toast{
  position:fixed;left:50%;transform:translateX(-50%) translateY(20px);
  bottom:calc(118px + env(safe-area-inset-bottom));
  background:#101623;border:1px solid var(--border);color:var(--text);
  padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;z-index:50;max-width:90vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{border-color:var(--accent);color:var(--accent)}
#toast.err{border-color:var(--red);color:var(--red)}
.spin-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:40px 0}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--accent);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.spin-text{color:var(--muted);font-size:13px}
.error-box{background:rgba(255,69,58,.08);border:1px solid rgba(255,69,58,.35);color:var(--red);padding:12px 14px;border-radius:12px;font-size:13px;display:flex;flex-direction:column;gap:10px;margin-top:12px}
.error-box button{align-self:flex-start;background:transparent;border:1px solid var(--red);color:var(--red);padding:6px 14px;border-radius:10px;font-size:13px;cursor:pointer}
.empty{color:var(--muted);text-align:center;padding:30px 0;font-size:14px}
.setup{padding:18px;font-size:14px;line-height:1.6;color:var(--muted)}
.setup b{color:var(--text)}
.setup code{color:var(--accent);background:var(--card-2);padding:2px 6px;border-radius:6px;font-size:12px}
.sync-btn{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:11px;padding:8px 10px;font-size:11px;font-weight:800;cursor:pointer;max-width:140px}
.sync-btn.attention{border-color:var(--yellow);color:var(--yellow)}
.sync-btn.error{border-color:var(--red);color:var(--red)}
.sync-panel{position:fixed;inset:0;z-index:60;background:rgba(5,8,14,.88);padding:20px 12px;overflow-y:auto}
.sync-panel-inner{max-width:650px;margin:20px auto;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px}
.sync-panel-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.sync-panel-title{font-size:19px;font-weight:900}
.sync-line{border:1px solid var(--border);border-radius:12px;background:var(--card-2);padding:12px;margin-top:9px}
.sync-line-title{font-size:13px;font-weight:750;overflow-wrap:anywhere}
.sync-line-detail{color:var(--muted);font-size:12px;margin-top:5px;overflow-wrap:anywhere}
.sync-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.sync-action{padding:9px 11px;border:1px solid var(--border);border-radius:9px;background:var(--card);color:var(--text);font-size:12px;cursor:pointer}
.sync-action.primary{border-color:var(--accent);color:var(--accent)}
.sync-action.danger{border-color:var(--red);color:var(--red)}
.sync-hint{color:var(--muted);font-size:12px;line-height:1.5;margin-top:10px}
.local-chip{color:var(--yellow);border-color:rgba(255,214,10,.4)}
.error-chip{color:var(--red);border-color:rgba(255,69,58,.4)}
.saving-chip{color:var(--blue);border-color:rgba(0,212,255,.4)}
.storage-alert{background:rgba(255,69,58,.1);color:var(--red);border:1px solid var(--red);padding:10px 14px;font-size:12px;text-align:center}

/* ---- переключение оформления ---- */
.theme-panel{position:fixed;inset:0;z-index:70;background:rgba(4,9,20,.76);padding:20px 12px;overflow-y:auto;display:flex;align-items:center;justify-content:center}
.theme-panel-inner{width:min(100%,540px);max-height:calc(100dvh - 40px);overflow-y:auto;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:0 24px 80px rgba(0,0,0,.3)}
.theme-panel-header{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:6px}
.theme-panel-title{font-size:20px;font-weight:850}
.theme-panel-subtitle{color:var(--muted);font-size:12px;line-height:1.5;margin-bottom:16px}
.theme-options{display:grid;gap:10px}
.theme-choice{display:grid;grid-template-columns:95px minmax(0,1fr) 22px;align-items:center;gap:14px;padding:12px;width:100%;border:1px solid var(--border);border-radius:12px;background:var(--card-2);color:var(--text);font:inherit;text-align:left;cursor:pointer;transition:border-color .16s,background .16s,transform .16s}
.theme-choice:hover{border-color:var(--accent)}
.theme-choice:active{transform:scale(.99)}
.theme-choice[aria-pressed="true"]{border-color:var(--accent);outline:1px solid var(--accent);background:var(--accent-soft)}
.theme-choice-name{display:block;font-size:14px;font-weight:850}
.theme-choice-desc{display:block;color:var(--muted);font-size:11px;line-height:1.35;margin-top:4px}
.theme-choice-check{color:var(--accent);font-size:20px;font-weight:900;opacity:0}
.theme-choice[aria-pressed="true"] .theme-choice-check{opacity:1}
.theme-preview{height:65px;display:flex;flex-direction:column;padding:6px;border-radius:6px;border:1px solid;overflow:hidden;gap:5px}
.theme-preview-bar{height:10px;flex-shrink:0;border-radius:2px}
.theme-preview-cols{display:flex;gap:5px;flex:1}
.theme-preview-tile{flex:1;border:1px solid;border-radius:3px}
.theme-preview-tile:last-child{flex:.55}
.preview-default{background:#0b0e14;border-color:#252d44}
.preview-default .theme-preview-bar{background:linear-gradient(90deg,#00ff88 20%,#141926 20%)}
.preview-default .theme-preview-tile{background:#141926;border-color:#252d44}
.preview-win98{background:#c0c0c0;border-color:#fff;border-radius:0;box-shadow:inset -2px -2px #404040}
.preview-win98 .theme-preview-bar{background:linear-gradient(90deg,#000080,#1084d0);border-radius:0}
.preview-win98 .theme-preview-tile{background:#d4d0c8;border-color:#777;border-radius:0;box-shadow:inset 1px 1px #fff}
.preview-business{background:#f3f6fb;border-color:#d4dfed}
.preview-business .theme-preview-bar{background:linear-gradient(90deg,#173969 20%,#fff 20%)}
.preview-business .theme-preview-tile{background:#fff;border-color:#d4dfed}
.theme-btn{font-size:20px}

/* ---- анимации только при переходах между экранами ---- */
@keyframes journalPageForward{from{opacity:.12;transform:translate3d(16px,0,0)}to{opacity:1;transform:translate3d(0,0,0)}}
@keyframes journalPageBack{from{opacity:.12;transform:translate3d(-16px,0,0)}to{opacity:1;transform:translate3d(0,0,0)}}
#app.page-enter-forward{animation:journalPageForward .24s cubic-bezier(.2,.8,.2,1) both}
#app.page-enter-back{animation:journalPageBack .24s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion:reduce){#app.page-enter-forward,#app.page-enter-back{animation:none!important}.theme-choice{transition:none!important}}

/* ---- Windows 98: серый интерфейс, объёмные кнопки, квадратные элементы ---- */
:root[data-theme="win98"]{
  --bg:#d4d0c8;--card:#c0c0c0;--card-2:#d4d0c8;--border:#747474;
  --text:#111;--muted:#414141;--accent:#000080;--accent-soft:#e2e2fa;
  --blue:#075d91;--yellow:#896000;--red:#ab1521;--purple:#66318b;--orange:#9a5300;
  color-scheme:light;
}
[data-theme="win98"] body{font-family:Tahoma,'MS Sans Serif',Arial,sans-serif;font-size:13px}
[data-theme="win98"] header{background:linear-gradient(90deg,#000080,#1084d0);border-bottom:2px solid #fff;backdrop-filter:none;box-shadow:0 2px 0 #666}
[data-theme="win98"] .header-title,[data-theme="win98"] header .header-sub{color:#fff}
[data-theme="win98"] .header-title{font-weight:750}
[data-theme="win98"] .card,[data-theme="win98"] .stat-mini,[data-theme="win98"] .icon-btn,[data-theme="win98"] .sync-btn,[data-theme="win98"] .seg button,[data-theme="win98"] .grade-btn,[data-theme="win98"] .search,[data-theme="win98"] .sync-action,[data-theme="win98"] .theme-choice{
  border-radius:0;border:2px solid;border-color:#fff #515151 #515151 #fff;box-shadow:inset 1px 1px #e6e6e6,1px 1px 0 #aaa;
}
[data-theme="win98"] .list-item:active,[data-theme="win98"] .grade-btn:active,[data-theme="win98"] .icon-btn:active,[data-theme="win98"] .seg button:active{border-color:#515151 #fff #fff #515151;box-shadow:inset 1px 1px #aaa}
[data-theme="win98"] .screen-title{font-weight:800}
[data-theme="win98"] .search{background:#fff;box-shadow:inset 1px 1px #666}
[data-theme="win98"] .seg button.on{color:#000080;background:#e5e5ff;border-color:#515151 #fff #fff #515151}
[data-theme="win98"] .badge,[data-theme="win98"] .tb,[data-theme="win98"] .chip{border-radius:0}
[data-theme="win98"] .grade-btn.g5.active{background:#d4ead4;color:#126225;box-shadow:inset 1px 1px #777}
[data-theme="win98"] .grade-btn.g4.active{background:#dce9f5;color:#075d91;box-shadow:inset 1px 1px #777}
[data-theme="win98"] .grade-btn.g3.active{background:#f6edbc;color:#896000;box-shadow:inset 1px 1px #777}
[data-theme="win98"] .grade-btn.g2.active{background:#f9d8d8;color:#ab1521;box-shadow:inset 1px 1px #777}
[data-theme="win98"] #sendbar{background:#c0c0c0;backdrop-filter:none;border-top:2px solid #fff}
[data-theme="win98"] #send-btn{background:#c0c0c0;color:#111;border:2px solid;border-color:#fff #515151 #515151 #fff;border-radius:0;box-shadow:inset 1px 1px #e6e6e6}
[data-theme="win98"] #send-btn:active{border-color:#515151 #fff #fff #515151}
[data-theme="win98"] #toast,[data-theme="win98"] .sync-panel-inner,[data-theme="win98"] .theme-panel-inner,[data-theme="win98"] .sync-line{border-radius:0;background:#c0c0c0;backdrop-filter:none}
[data-theme="win98"] .sync-panel,[data-theme="win98"] .theme-panel{background:rgba(0,0,0,.43)}
[data-theme="win98"] .sync-panel-header,[data-theme="win98"] .theme-panel-header{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;padding:5px 8px;margin:-9px -9px 12px}
[data-theme="win98"] .sync-panel-header .icon-btn,[data-theme="win98"] .theme-panel-header .icon-btn{height:29px;width:29px;color:#111}
[data-theme="win98"] .theme-choice{background:#d4d0c8}
[data-theme="win98"] .theme-choice[aria-pressed="true"]{background:#e2e2fa;outline:1px dotted #000080}
[data-theme="win98"] .theme-choice-name{font-weight:750}

/* ---- Деловой: светлый корпоративный интерфейс ---- */
:root[data-theme="business"]{
  --bg:#f3f6fb;--card:#fff;--card-2:#eef3f9;--border:#d5dfeb;
  --text:#1b2941;--muted:#617188;--accent:#1765bb;--accent-soft:#e7f1ff;
  --blue:#2970a9;--yellow:#987000;--red:#bd3040;--purple:#7046a6;--orange:#a95a13;
  color-scheme:light;
}
[data-theme="business"] body{font-family:'Segoe UI',Roboto,Arial,sans-serif}
[data-theme="business"] header{background:rgba(255,255,255,.96);box-shadow:0 2px 14px rgba(24,56,91,.06);border-bottom-color:#d5dfeb}
[data-theme="business"] .header-title{font-weight:750;color:#173969}
[data-theme="business"] .card{border-radius:10px;box-shadow:0 3px 14px rgba(25,53,90,.035)}
[data-theme="business"] .screen-title{font-weight:800;letter-spacing:-.4px}
[data-theme="business"] .icon-btn,[data-theme="business"] .sync-btn,[data-theme="business"] .search,[data-theme="business"] .grade-btn,[data-theme="business"] .seg button{border-radius:8px}
[data-theme="business"] .list-item:hover{border-color:#9ab9dd;background:#f9fbff}
[data-theme="business"] .stat-mini{border-radius:9px;background:#fff}
[data-theme="business"] .seg button.on{background:#e7f1ff}
[data-theme="business"] .grade-btn.g5.active{background:#e2f6ec;border-color:#218559;color:#187345;box-shadow:none}
[data-theme="business"] #sendbar{background:rgba(255,255,255,.97);box-shadow:0 -3px 16px rgba(24,56,91,.055)}
[data-theme="business"] #send-btn{background:linear-gradient(135deg,#1765bb,#114a8d);color:#fff;border-radius:9px}
[data-theme="business"] #toast{background:#fff;box-shadow:0 8px 30px rgba(25,53,90,.15)}
[data-theme="business"] .sync-panel-inner,[data-theme="business"] .theme-panel-inner{background:#fff;border-radius:14px}
[data-theme="business"] .sync-line{background:#f7f9fc}
[data-theme="business"] .theme-choice{background:#f7f9fc}
[data-theme="business"] .theme-choice[aria-pressed="true"]{background:#edf5ff}

@media (max-width:420px){
  .header-row{gap:7px}
  .header-title{font-size:15px}
  .header-sub{font-size:10px}
  .sync-btn{max-width:112px;padding:8px 6px;font-size:10px}
  .header-row>.icon-btn{width:36px;height:36px}
  .theme-choice{grid-template-columns:72px minmax(0,1fr) 18px;gap:10px}
  .theme-preview{height:56px}
}
[hidden]{display:none!important}
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div style="flex:1">
      <div class="header-title">📗 Мобильный журнал</div>
      <div class="header-sub">оценки по студенту — за все даты сразу</div>
    </div>
    <button id="sync-btn" class="sync-btn" onclick="toggleQueuePanel()" title="Очередь отправки">Подготовка…</button>
    <button id="theme-btn" class="icon-btn theme-btn" onclick="toggleThemePanel()" title="Выбрать тему" aria-label="Выбрать тему" aria-expanded="false">🎨</button>
    <button class="icon-btn" onclick="refresh()" title="Обновить">⟳</button>
  </div>
</header>

<div id="storage-alert" class="storage-alert" hidden></div>
<div id="queue-panel" class="sync-panel" hidden>
  <div class="sync-panel-inner">
    <div class="sync-panel-header">
      <div class="sync-panel-title">Очередь синхронизации</div>
      <button class="icon-btn" onclick="toggleQueuePanel(false)" title="Закрыть">✕</button>
    </div>
    <div id="queue-content"></div>
  </div>
</div>
<div id="theme-panel" class="theme-panel" role="dialog" aria-modal="true" aria-labelledby="theme-title" hidden onclick="if(event.target === this) toggleThemePanel(false)">
  <div class="theme-panel-inner">
    <div class="theme-panel-header">
      <div class="theme-panel-title" id="theme-title">Оформление журнала</div>
      <button class="icon-btn" onclick="toggleThemePanel(false)" title="Закрыть" aria-label="Закрыть">✕</button>
    </div>
    <div class="theme-panel-subtitle">Выберите оформление. Оно сохранится в браузере и восстановится при следующем входе.</div>
    <div class="theme-options">
      <button class="theme-choice" data-theme-option="default" aria-pressed="false" onclick="setTheme('default')">
        <span class="theme-preview preview-default" aria-hidden="true"><span class="theme-preview-bar"></span><span class="theme-preview-cols"><span class="theme-preview-tile"></span><span class="theme-preview-tile"></span></span></span>
        <span><span class="theme-choice-name">Стандартная</span><span class="theme-choice-desc">Тёмная тема с яркими акцентами</span></span>
        <span class="theme-choice-check" aria-hidden="true">✓</span>
      </button>
      <button class="theme-choice" data-theme-option="win98" aria-pressed="false" onclick="setTheme('win98')">
        <span class="theme-preview preview-win98" aria-hidden="true"><span class="theme-preview-bar"></span><span class="theme-preview-cols"><span class="theme-preview-tile"></span><span class="theme-preview-tile"></span></span></span>
        <span><span class="theme-choice-name">Windows 98</span><span class="theme-choice-desc">Классический интерфейс Windows</span></span>
        <span class="theme-choice-check" aria-hidden="true">✓</span>
      </button>
      <button class="theme-choice" data-theme-option="business" aria-pressed="false" onclick="setTheme('business')">
        <span class="theme-preview preview-business" aria-hidden="true"><span class="theme-preview-bar"></span><span class="theme-preview-cols"><span class="theme-preview-tile"></span><span class="theme-preview-tile"></span></span></span>
        <span><span class="theme-choice-name">Деловой</span><span class="theme-choice-desc">Светлый стиль корпоративной системы</span></span>
        <span class="theme-choice-check" aria-hidden="true">✓</span>
      </button>
    </div>
  </div>
</div>
<main id="app"></main>

<div id="sendbar">
  <div id="send-info" class="send-info">Отметьте оценки</div>
  <button id="send-btn" onclick="sendGrades()" disabled>Отправить в очередь</button>
</div>
<div id="toast"></div>

<script>
// ⚠️ ВСТАВЬТЕ СЮДА URL ВАШЕГО ВЕБ-ПРИЛОЖЕНИЯ APPS SCRIPT (заканчивается на /exec)
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyqsjoEgVxuABle7p4im0wh_EUL-kDVXVW0TglSYhkfqPuULLZQhqnDwfOeHID_4Qh_mQ/exec';

const state = {
  screen: 'groups',   // groups | students | student
  groups: [],
  search: '',
  group: null,          // {group, subjectCode, subjectName}
  data: null,           // {students, lessons}
  groupCache: new Map(), // уже загруженные группы текущей вкладки
  studentSearch: '',
  subFilter: '',        // '' | '1' | '2'
  studentIdx: -1,       // индекс студента в data.students
  drafts: new Map(),    // ключ ячейки -> локально сохранённый черновик
  outbox: [],           // долговременная очередь отправки
  storageReady: false,
  storageIssue: '',
  syncing: false,
  lastSyncError: '',
  queueOpen: false,
  loading: false,
  sending: false,
  error: ''
};

const $app = document.getElementById('app');
const STORAGE_NAME = 'mobile-journal-grade-queue-v1';
let storageDB = null;
let draftWriteChain = Promise.resolve();
let syncTimer = null;
let retryDelay = 1500;
let lastRenderedScreen = null;
let navigationDirection = 'forward';

/* ---------- выбор темы ---------- */
const THEME_STORAGE_KEY = 'mobile-journal-theme-v1';
const THEME_COLORS = { default: '#0b0e14', win98: '#000080', business: '#ffffff' };
function updateThemeChoices(){
  const current = document.documentElement.dataset.theme || 'default';
  document.querySelectorAll('[data-theme-option]').forEach(button => {
    button.setAttribute('aria-pressed', String(button.dataset.themeOption === current));
  });
}
function toggleThemePanel(force){
  const panel = document.getElementById('theme-panel');
  const open = typeof force === 'boolean' ? force : panel.hidden;
  panel.hidden = !open;
  document.getElementById('theme-btn').setAttribute('aria-expanded', String(open));
  if(open){
    if(state.queueOpen) toggleQueuePanel(false);
    updateThemeChoices();
    panel.querySelector('[aria-pressed="true"]')?.focus();
  }else{
    document.getElementById('theme-btn').focus();
  }
}
function setTheme(name){
  if(!Object.hasOwn(THEME_COLORS, name)) return;
  document.documentElement.dataset.theme = name;
  document.querySelector('meta[name="theme-color"]').content = THEME_COLORS[name];
  try {
    localStorage.setItem(THEME_STORAGE_KEY, name);
  }catch(error){
    toast('Тема изменена, но браузер не разрешил сохранить выбор', 'err');
  }
  updateThemeChoices();
  toggleThemePanel(false);
}
document.addEventListener('keydown', event => {
  if(event.key === 'Escape' && !document.getElementById('theme-panel').hidden){
    toggleThemePanel(false);
  }
});

/* ---------- утилиты ---------- */
function escapeHtml(v){
  return String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function isConfigured(){ return /^https:\/\//.test(APPS_SCRIPT_URL); }

async function api(action, payload, options = {}){
  const res = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action }, payload || {})),
    signal: options.signal
  });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return await res.json();
}

function toast(msg, type){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + (type || '');
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.className = ''; }, 3200);
}
function spinnerHTML(){
  return '<div class="spin-wrap"><div class="spinner"></div><div class="spin-text">Загрузка…</div></div>';
}
function errorHTML(){
  return `<div class="error-box">⚠️ ${escapeHtml(state.error)}
    <button onclick="retry()">Повторить</button></div>`;
}
function retry(){
  if(state.screen === 'groups') loadGroups(); else loadGroupData();
}
function subBadge(subgroup){
  if(subgroup === '1') return '<span class="badge b1">П1</span>';
  if(subgroup === '2') return '<span class="badge b2">П2</span>';
  return '<span class="badge b0">без П</span>';
}
function isLocked(type, subgroup){
  if(!subgroup) return false;
  if(type === 'П1' && subgroup === '2') return true;
  if(type === 'П2' && subgroup === '1') return true;
  return false;
}
function relevantLabel(s){
  if(s.subgroup === '1') return 'Г (лекции) + Подгруппа 1';
  if(s.subgroup === '2') return 'Г (лекции) + Подгруппа 2';
  return 'Все занятия';
}

/* ---------- надёжное локальное хранение ---------- */
function cellKey(group, subjectCode, row, lessonIndex){
  return JSON.stringify([group, subjectCode, Number(row), Number(lessonIndex)]);
}
function operationCellKey(op){
  return cellKey(op.group, op.subjectCode, op.studentRow, op.lessonIndex);
}
function selectedStudent(){
  return state.data?.students?.[state.studentIdx] || null;
}
function currentDrafts(){
  const student = selectedStudent();
  if(!student || !state.group) return [];
  return [...state.drafts.values()].filter(d =>
    d.group === state.group.group && d.subjectCode === state.group.subjectCode &&
    d.studentRow === student.row
  );
}
function latestQueuedGrade(key){
  for(let i = state.outbox.length - 1; i >= 0; i--){
    if(operationCellKey(state.outbox[i]) === key) return state.outbox[i];
  }
  return null;
}
function effectiveGrade(lesson, studentIndex){
  const student = state.data?.students?.[studentIndex];
  if(!student || !state.group) return '';
  const key = cellKey(state.group.group, state.group.subjectCode, student.row, lesson.index);
  const draft = state.drafts.get(key);
  if(draft) return String(draft.value);
  const queued = latestQueuedGrade(key);
  if(queued) return String(queued.value);
  return String(lesson.grades[studentIndex] ?? '').trim();
}
function openStorage(){
  return new Promise((resolve, reject) => {
    if(!('indexedDB' in window)) { reject(new Error('IndexedDB недоступна')); return; }
    const request = indexedDB.open(STORAGE_NAME, 1);
    request.onupgradeneeded = () => {
      const db = request.result;
      if(!db.objectStoreNames.contains('drafts')) db.createObjectStore('drafts', { keyPath: 'key' });
      if(!db.objectStoreNames.contains('outbox')) db.createObjectStore('outbox', { keyPath: 'localId', autoIncrement: true });
    };
    request.onsuccess = () => { storageDB = request.result; resolve(); };
    request.onerror = () => reject(request.error || new Error('Не удалось открыть IndexedDB'));
    request.onblocked = () => reject(new Error('Закройте другие вкладки журнала и повторите попытку'));
  });
}
function storageTransaction(storeNames, mode, action){
  return new Promise((resolve, reject) => {
    if(!storageDB) { reject(new Error('Локальная база не открыта')); return; }
    const tx = storageDB.transaction(storeNames, mode);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error || new Error('Ошибка записи в браузере'));
    tx.onabort = () => reject(tx.error || new Error('Запись прервана'));
    try { action(tx); } catch(error) { try { tx.abort(); } catch(_) {} reject(error); }
  });
}
function storageReadAll(storeName){
  return new Promise((resolve, reject) => {
    const tx = storageDB.transaction([storeName], 'readonly');
    const request = tx.objectStore(storeName).getAll();
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error || new Error('Ошибка чтения IndexedDB'));
  });
}
async function reloadLocalStorage(){
  const [drafts, outbox] = await Promise.all([storageReadAll('drafts'), storageReadAll('outbox')]);
  state.drafts = new Map(drafts.map(d => [d.key, d]));
  state.outbox = outbox.sort((a,b) => a.localId - b.localId);
  renderSyncStatus();
}
function reportStorageError(error){
  state.storageIssue = String(error?.message || error);
  state.storageReady = false;
  const banner = document.getElementById('storage-alert');
  banner.textContent = '⚠️ Локальная запись недоступна: ' + state.storageIssue + '. Не продолжайте ввод без устранения ошибки.';
  banner.hidden = false;
  toast('Ошибка локального сохранения', 'err');
  renderSyncStatus();
}
function persistDraft(key, draft){
  draftWriteChain = draftWriteChain.catch(() => {}).then(() =>
    storageTransaction(['drafts'], 'readwrite', tx => {
      if(draft) tx.objectStore('drafts').put(draft);
      else tx.objectStore('drafts').delete(key);
    })
  );
  draftWriteChain.catch(reportStorageError);
  return draftWriteChain;
}
function renderSyncStatus(){
  const btn = document.getElementById('sync-btn');
  if(!btn) return;
  const n = state.outbox.length;
  const issues = state.outbox.filter(o => o.status === 'conflict' || o.status === 'invalid').length;
  btn.className = 'sync-btn' + (issues || state.storageIssue ? ' error' : n ? ' attention' : '');
  if(state.storageIssue) btn.textContent = '⚠️ Ошибка памяти';
  else if(!state.storageReady) btn.textContent = 'Подготовка…';
  else if(issues) btn.textContent = `⚠️ Проблем: ${issues}`;
  else if(n && !navigator.onLine) btn.textContent = `Офлайн · ${n}`;
  else if(n && state.syncing) btn.textContent = `↻ Отправка · ${n}`;
  else if(n) btn.textContent = `Очередь · ${n}`;
  else if(state.drafts.size) btn.textContent = `Черновики · ${state.drafts.size}`;
  else btn.textContent = '✓ Всё отправлено';
  if(state.queueOpen) renderQueuePanel();
}
function toggleQueuePanel(force){
  state.queueOpen = typeof force === 'boolean' ? force : !state.queueOpen;
  document.getElementById('queue-panel').hidden = !state.queueOpen;
  if(state.queueOpen) renderQueuePanel();
}
function renderQueuePanel(){
  const container = document.getElementById('queue-content');
  const drafts = state.drafts.size;
  const queued = state.outbox.filter(o => o.status === 'queued').length;
  const problems = state.outbox.filter(o => o.status !== 'queued').length;
  const entries = state.outbox.map(op => {
    const isConflict = op.status === 'conflict';
    const isInvalid = op.status === 'invalid';
    const status = isConflict ? '⚠️ Конфликт' : isInvalid ? '❌ Отклонено' : '⏳ Ожидает отправки';
    const label = `${op.studentSurname} ${op.studentName} · ${op.lessonDate || 'Без даты'} · ${op.lessonType || 'Занятие'}`;
    return `<div class="sync-line">
      <div class="sync-line-title">${escapeHtml(label)}</div>
      <div class="sync-line-detail">${escapeHtml(op.group)} · ${status} · оценка: ${escapeHtml(op.value)}</div>
      ${op.error ? `<div class="sync-line-detail" style="color:var(--red)">${escapeHtml(op.error)}</div>` : ''}
      ${(isConflict || isInvalid) ? `<div class="sync-actions">
        ${isConflict && op.reason === 'value_conflict' ? `<button class="sync-action primary" onclick="resolveQueueOperation(${op.localId},'mine')">Записать мою оценку</button>` : ''}
        <button class="sync-action danger" onclick="resolveQueueOperation(${op.localId},'discard')">Отменить изменение</button>
      </div>` : ''}
    </div>`;
  }).join('');
  container.innerHTML = `
    <div class="sync-line-detail">Черновиков: ${drafts} · В очереди: ${queued} · Требуют решения: ${problems}</div>
    ${state.lastSyncError ? `<div class="sync-line-detail" style="color:var(--yellow)">Последняя ошибка связи: ${escapeHtml(state.lastSyncError)}</div>` : ''}
    <div class="sync-actions">
      <button class="sync-action primary" onclick="scheduleSync(0)">↻ Повторить отправку</button>
      <button class="sync-action" onclick="downloadQueueBackup()">↓ Скачать резервную копию</button>
      <button class="sync-action" onclick="document.getElementById('backup-import').click()">↑ Восстановить из копии</button>
      <input id="backup-import" type="file" accept="application/json,.json" hidden onchange="importQueueBackup(this.files[0]);this.value=''">
    </div>
    <div class="sync-hint">Черновики и очередь сохраняются в этом браузере. Не очищайте данные сайта до завершения синхронизации. Резервная копия содержит персональные данные студентов.</div>
    ${entries || '<div class="empty">Неотправленных оценок нет.</div>'}`;
}
function downloadQueueBackup(){
  const snapshot = { version: 1, exportedAt: new Date().toISOString(), drafts: [...state.drafts.values()], outbox: state.outbox };
  const blob = new Blob([JSON.stringify(snapshot, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'journal_unsent_backup_' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
async function importQueueBackup(file){
  if(!file || !state.storageReady) return;
  try {
    if(file.size > 5 * 1024 * 1024) throw new Error('Резервная копия слишком большая');
    const backup = JSON.parse(await file.text());
    if(backup.version !== 1 || !Array.isArray(backup.drafts) || !Array.isArray(backup.outbox)) {
      throw new Error('Неизвестный формат резервной копии');
    }
    if(backup.drafts.length + backup.outbox.length > 5000) throw new Error('Слишком много записей');
    const validGrade = value => ['2','3','4','5'].includes(String(value));
    if(backup.drafts.some(d => !d.key || !validGrade(d.value)) ||
       backup.outbox.some(o => !/^[a-f0-9-]{36}$/i.test(String(o.id)) || !validGrade(o.value))) {
      throw new Error('Резервная копия содержит повреждённые записи');
    }
    if(!confirm(`Восстановить ${backup.drafts.length} черновиков и ${backup.outbox.length} записей очереди? Существующие записи не будут удалены.`)) return;
    const known = new Set(state.outbox.map(o => o.id));
    await storageTransaction(['drafts','outbox'], 'readwrite', tx => {
      backup.drafts.forEach(d => {
        if(!state.drafts.has(d.key)) tx.objectStore('drafts').put(d);
      });
      backup.outbox.forEach(o => {
        if(!known.has(o.id)) {
          const restored = { ...o };
          delete restored.localId;
          tx.objectStore('outbox').add(restored);
          known.add(o.id);
        }
      });
    });
    await reloadLocalStorage();
    render();
    scheduleSync(0);
    toast('Резервная копия восстановлена', 'ok');
  } catch(error) {
    toast('Ошибка импорта: ' + String(error?.message || error), 'err');
  }
}
async function resolveQueueOperation(localId, action){
  const op = state.outbox.find(item => item.localId === Number(localId));
  if(!op) return;
  try {
    if(action === 'mine'){
      if(op.reason !== 'value_conflict') return;
      const updated = { ...op, expectedValue: op.currentValue, status: 'queued', error: '', reason: '' };
      await storageTransaction(['outbox'], 'readwrite', tx => tx.objectStore('outbox').put(updated));
    } else if(action === 'discard'){
      if(!confirm('Удалить это изменение и все последующие изменения той же оценки из локальной очереди?')) return;
      const key = operationCellKey(op);
      const related = state.outbox.filter(item => operationCellKey(item) === key);
      await storageTransaction(['outbox','drafts'], 'readwrite', tx => {
        related.forEach(item => tx.objectStore('outbox').delete(item.localId));
        tx.objectStore('drafts').delete(key);
      });
    }
    await reloadLocalStorage();
    render();
    scheduleSync(0);
  } catch(error) { reportStorageError(error); }
}

/* ---------- отправка очереди в фоне ---------- */
function scheduleSync(delay = 0){
  if(syncTimer) clearTimeout(syncTimer);
  syncTimer = setTimeout(() => { syncTimer = null; processQueue(); }, delay);
}
function buildNextBatch(){
  const seen = new Set();
  const batch = [];
  let group = null;
  for(const op of state.outbox){
    const key = operationCellKey(op);
    if(seen.has(key)) continue;
    seen.add(key); // последующие изменения той же ячейки ждут подтверждения первого
    if(op.status !== 'queued') continue;
    if(!group) group = { group: op.group, subjectCode: op.subjectCode };
    if(op.group !== group.group || op.subjectCode !== group.subjectCode) continue;
    batch.push(op);
    if(batch.length >= 30) break;
  }
  return group ? { ...group, batch } : null;
}
function markConfirmedGrade(op){
  const cached = state.groupCache.get(JSON.stringify([op.group, op.subjectCode]));
  const groupData = cached || ((state.group?.group === op.group && state.group?.subjectCode === op.subjectCode) ? state.data : null);
  if(!groupData) return;
  const lesson = groupData.lessons.find(l => l.id === op.lessonId);
  const idx = groupData.students.findIndex(s => op.studentCode
    ? s.code === op.studentCode
    : s.surname === op.studentSurname && s.name === op.studentName && s.subgroup === op.studentSubgroup);
  if(lesson && idx >= 0) lesson.grades[idx] = op.value;
}
async function processQueue(){
  if(!state.storageReady || state.syncing) return;
  const next = buildNextBatch();
  if(!next) { renderSyncStatus(); return; }
  if(!navigator.onLine) { state.lastSyncError = 'Нет интернет-соединения'; renderSyncStatus(); return; }

  state.syncing = true;
  renderSyncStatus();
  const aborter = new AbortController();
  const timeout = setTimeout(() => aborter.abort(), 25000);
  try {
    const response = await api('submitQueuedGrades', {
      group: next.group,
      subjectCode: next.subjectCode,
      operations: next.batch.map(op => ({
        id: op.id, studentRow: op.studentRow, studentCode: op.studentCode,
        studentSurname: op.studentSurname, studentName: op.studentName,
        studentSubgroup: op.studentSubgroup, lessonId: op.lessonId,
        lessonIndex: op.lessonIndex, lessonType: op.lessonType,
        lessonDate: op.lessonDate, expectedValue: op.expectedValue, value: op.value
      }))
    }, { signal: aborter.signal });
    if(!response.success || !Array.isArray(response.results)){
      throw new Error(response.error || 'Некорректный ответ сервера');
    }
    const answers = new Map(response.results.map(result => [result.id, result]));
    if(next.batch.some(op => !answers.has(op.id))) throw new Error('Сервер подтвердил не все операции');

    await storageTransaction(['outbox'], 'readwrite', tx => {
      next.batch.forEach(op => {
        const answer = answers.get(op.id);
        if(answer.status === 'saved') tx.objectStore('outbox').delete(op.localId);
        else tx.objectStore('outbox').put({ ...op,
          status: answer.status === 'conflict' ? 'conflict' : 'invalid',
          reason: answer.reason || '', error: answer.error || 'Сервер отклонил запись',
          currentValue: answer.currentValue ?? ''
        });
      });
    });
    next.batch.forEach(op => { if(answers.get(op.id).status === 'saved') markConfirmedGrade(op); });
    await reloadLocalStorage();
    state.lastSyncError = '';
    retryDelay = 1500;
    render();
    if(buildNextBatch()) scheduleSync(80);
  } catch(error){
    state.lastSyncError = error?.name === 'AbortError' ? 'Превышено время ожидания' : String(error?.message || error);
    retryDelay = Math.min(Math.round(retryDelay * 1.8), 60000);
    scheduleSync(retryDelay + Math.floor(Math.random() * 500));
  } finally {
    clearTimeout(timeout);
    state.syncing = false;
    renderSyncStatus();
  }
}

/* ---------- загрузка ---------- */
async function loadGroups(){
  state.loading = true; state.error = ''; state.screen = 'groups'; render();
  try{
    const res = await api('getGroups');
    if(!res.success) throw new Error(res.error || 'Ошибка загрузки');
    state.groups = res.groups || [];
  }catch(e){ state.error = e.message; }
  state.loading = false; render();
}

async function selectGroup(i){
  const g = state.groups[i];
  if(!g) return;
  navigationDirection = 'forward';
  state.group = g;
  state.subFilter = '';
  state.studentSearch = '';
  state.studentIdx = -1;
  state.screen = 'students';
  state.data = state.groupCache.get(JSON.stringify([g.group, g.subjectCode])) || null;
  if(state.data){
    state.loading = false;
    state.error = '';
    render();
    if(navigator.onLine) loadGroupData(true);
  }else{
    await loadGroupData();
  }
}

async function loadGroupData(silent = false){
  if(!silent){ state.loading = true; state.error = ''; render(); }
  const selected = state.group;
  if(!selected) return;
  try{
    const res = await api('getGroupData', {
      group: selected.group,
      subjectCode: selected.subjectCode
    });
    if(!res.success) throw new Error(res.error || 'Ошибка загрузки');
    if(state.group !== selected) return;
    state.data = res;
    state.groupCache.set(JSON.stringify([selected.group, selected.subjectCode]), res);
    if(state.studentIdx >= res.students.length) state.studentIdx = -1;
  }catch(e){
    if(state.group !== selected) return;
    if(state.data){
      state.error = '';
      if(!silent) toast('Нет соединения. Показаны ранее загруженные данные.', 'err');
    }else{
      state.error = e.message;
    }
  }
  state.loading = false; render();
}

function backToGroups(){
  navigationDirection = 'back';
  state.screen = 'groups';
  state.group = null; state.data = null;
  state.studentIdx = -1;
  render();
}
function backToStudents(){
  navigationDirection = 'back';
  state.screen = 'students';
  state.studentIdx = -1;
  render();
}
function openStudent(i){
  navigationDirection = 'forward';
  state.studentIdx = i;
  state.screen = 'student';
  render();
  window.scrollTo(0, 0);
}
function refresh(){
  if(!isConfigured()){ render(); return; }
  if(state.screen === 'groups') loadGroups();
  else if(state.group) loadGroupData();
}

/* ---------- статистика по студенту ---------- */
function studentSummary(pos){
  const s = state.data.students[pos];
  const rel = state.data.lessons.filter(l => !isLocked(l.type, s.subgroup));
  let graded = 0, sum = 0, cnt = 0, abs = 0;
  rel.forEach(l => {
    const g = effectiveGrade(l, pos).toLowerCase();
    if(g === 'н' || g === 'нб'){ abs++; return; }
    if(g !== ''){
      graded++;
      const n = parseFloat(g.replace(',', '.'));
      if(!isNaN(n)){ sum += n; cnt++; }
    }
  });
  return { total: rel.length, graded, avg: cnt ? sum / cnt : 0, abs };
}

/* ---------- логика оценок ---------- */
function tapGrade(lessonIndex, g){
  if(state.sending){ toast('Завершается локальное сохранение, повторите действие', 'err'); return; }
  if(!state.storageReady){ toast('Невозможно сохранить оценку в браузере', 'err'); return; }
  const student = selectedStudent();
  const lesson = state.data?.lessons?.find(l => l.index === lessonIndex);
  if(!student || !lesson) return;
  const key = cellKey(state.group.group, state.group.subjectCode, student.row, lessonIndex);
  const existing = state.drafts.get(key);
  if(existing?.value === g){
    state.drafts.delete(key);
    persistDraft(key, null);
  } else {
    const draft = {
      key, group: state.group.group, subjectCode: state.group.subjectCode,
      studentRow: student.row, studentCode: student.code || '',
      studentSurname: student.surname, studentName: student.name,
      studentSubgroup: student.subgroup || '', lessonId: lesson.id || '',
      lessonIndex, lessonType: lesson.type, lessonDate: lesson.date,
      value: g, updatedAt: Date.now()
    };
    state.drafts.set(key, draft);
    persistDraft(key, draft);
  }
  render();
}
function setSubFilter(f){
  state.subFilter = f;
  render();
}

async function sendGrades(){
  if(state.sending || !state.storageReady) return;
  const student = state.data?.students?.[state.studentIdx];
  if(!student) return;
  const drafts = currentDrafts();
  if(!drafts.length) return;
  if(drafts.some(d => !d.lessonId)){
    toast('Сначала обновите Code.gs: не получены ID занятий', 'err');
    return;
  }
  const studentIndex = state.studentIdx;
  const snapshotData = state.data;
  const expectedByKey = new Map(drafts.map(d => {
    const last = latestQueuedGrade(d.key);
    const lesson = snapshotData.lessons.find(l => l.index === d.lessonIndex);
    return [d.key, last ? last.value : String(lesson?.grades[studentIndex] ?? '').trim()];
  }));

  state.sending = true; renderSendbar();
  try{
    await draftWriteChain; // нельзя отправить до подтверждения локальной записи
    const operations = drafts.map(d => {
      return {
        ...d, id: crypto.randomUUID(), expectedValue: expectedByKey.get(d.key),
        status: 'queued', queuedAt: Date.now(), error: '', reason: ''
      };
    });
    // Добавление операций и удаление черновиков — одна транзакция IndexedDB.
    await storageTransaction(['drafts', 'outbox'], 'readwrite', tx => {
      operations.forEach(op => {
        tx.objectStore('outbox').add(op);
        tx.objectStore('drafts').delete(op.key);
      });
    });
    await reloadLocalStorage();
    toast(`✓ ${operations.length} оценок в очереди. Можно продолжать работу.`, 'ok');
    scheduleSync(0);
  }catch(e){
    reportStorageError(e);
  }
  state.sending = false; render();
}

/* ---------- рендер ---------- */
function render(){
  const screenKey = isConfigured() ? state.screen : 'setup';
  const changedScreen = lastRenderedScreen !== null && lastRenderedScreen !== screenKey;
  document.getElementById('sendbar').style.display = 'none';
  if(!isConfigured()) renderSetup();
  else {
    if(state.screen === 'groups') renderGroups();
    else if(state.screen === 'students') renderStudents();
    else renderStudent();
    renderSendbar();
    renderSyncStatus();
  }
  lastRenderedScreen = screenKey;
  if(changedScreen){
    $app.classList.remove('page-enter-forward', 'page-enter-back');
    // Перезапуск анимации только при смене экрана, не при оценках и синхронизации.
    void $app.offsetWidth;
    $app.classList.add(navigationDirection === 'back' ? 'page-enter-back' : 'page-enter-forward');
  }
}

function renderSetup(){
  $app.innerHTML = `
    <div class="screen-title">Настройка</div>
    <div class="card setup">
      <p><b>1.</b> Установите обновлённый <code>Code.gs</code> и настройте безопасный доступ к веб-приложению.</p>
      <p><b>2.</b> Скопируйте URL веб-приложения (заканчивается на <code>/exec</code>).</p>
      <p><b>3.</b> Вставьте его в константу <code>APPS_SCRIPT_URL</code> в начале скрипта этого файла.</p>
    </div>`;
}

/* --- экран 1: группы --- */
function groupListHTML(){
  const q = state.search.trim().toLowerCase();
  const list = state.groups
    .map((g, i) => ({ g, i }))
    .filter(({ g }) => !q || (g.group + ' ' + g.subjectName).toLowerCase().includes(q));
  if(!list.length) return '<div class="empty">Ничего не найдено</div>';
  return list.map(({ g, i }) => `
    <div class="card list-item" onclick="selectGroup(${i})">
      <div style="flex:1;min-width:0">
        <div class="li-name">${escapeHtml(g.group)}</div>
        <div class="li-sub">${escapeHtml(g.subjectName)}${
          g.subjectCode && g.subjectCode !== 'Other' ? ' · ' + escapeHtml(g.subjectCode) : ''
        }</div>
      </div>
      <span class="chev">›</span>
    </div>`).join('');
}
function onSearch(v){
  state.search = v;
  const el = document.getElementById('group-list');
  if(el) el.innerHTML = groupListHTML();
}
function renderGroups(){
  $app.innerHTML = `
    <div class="screen-title">Выберите группу</div>
    <input class="search" placeholder="Поиск группы или предмета…"
      value="${escapeHtml(state.search)}" oninput="onSearch(this.value)">
    ${state.loading ? spinnerHTML() : ''}
    ${state.error ? errorHTML() : ''}
    <div class="list" id="group-list">${state.loading || (state.error && !state.groups.length) ? '' : groupListHTML()}</div>`;
}

/* --- экран 2: студенты --- */
function studentListHTML(){
  const q = state.studentSearch.trim().toLowerCase();
  const list = state.data.students
    .map((s, i) => ({ s, i }))
    .filter(({ s }) => !state.subFilter || s.subgroup === state.subFilter)
    .filter(({ s }) => !q || (s.surname + ' ' + s.name).toLowerCase().includes(q));
  if(!list.length) return '<div class="empty">Никого не найдено</div>';
  return list.map(({ s, i }) => {
    const sum = studentSummary(i);
    return `
    <div class="card list-item" onclick="openStudent(${i})">
      <div style="flex:1;min-width:0">
        <div class="li-name">${escapeHtml(s.surname)} ${escapeHtml(s.name)}</div>
        <div class="li-sub">оценок: ${sum.graded}${sum.avg ? ' · ср. ' + sum.avg.toFixed(2) : ''}${sum.abs ? ' · пропусков: ' + sum.abs : ''}</div>
      </div>
      ${subBadge(s.subgroup)}
      <span class="chev">›</span>
    </div>`;
  }).join('');
}
function onStudentSearch(v){
  state.studentSearch = v;
  const el = document.getElementById('student-list');
  if(el) el.innerHTML = studentListHTML();
}
function renderStudents(){
  const g = state.group;
  let body = '';
  if(state.loading) body = spinnerHTML();
  else if(state.error) body = errorHTML();
  else if(state.data){
    body = `
      <input class="search" placeholder="Поиск студента…"
        value="${escapeHtml(state.studentSearch)}" oninput="onStudentSearch(this.value)">
      <div class="seg">
        ${[['','Все'],['1','Подгр. 1'],['2','Подгр. 2']].map(([v, l]) =>
          `<button class="${state.subFilter === v ? 'on' : ''}" onclick="setSubFilter('${v}')">${l}</button>`).join('')}
      </div>
      <div class="list" id="student-list">${studentListHTML()}</div>`;
  }
  $app.innerHTML = `
    <div class="group-head">
      <button class="icon-btn" onclick="backToGroups()">←</button>
      <div style="flex:1;min-width:0">
        <div class="screen-title small">${escapeHtml(g.group)}</div>
        <div class="header-sub">${escapeHtml(g.subjectName)} · выберите студента</div>
      </div>
    </div>
    ${body}`;
}

/* --- экран 3: занятия студента --- */
function lessonHTML(l, pos){
  const saved = String(l.grades[pos] ?? '').trim();
  const s = state.data.students[pos];
  const key = cellKey(state.group.group, state.group.subjectCode, s.row, l.index);
  const draft = state.drafts.get(key);
  const queued = latestQueuedGrade(key);
  const pendingVal = draft?.value || queued?.value || '';
  const statusChip = draft
    ? '<span class="chip local-chip">Черновик в браузере</span>'
    : queued?.status === 'conflict' || queued?.status === 'invalid'
      ? '<span class="chip error-chip">Требует проверки</span>'
      : queued ? '<span class="chip saving-chip">В очереди на отправку</span>' : '';
  const tClass =
    l.type === 'П1' ? 't-P1' :
    l.type === 'П2' ? 't-P2' :
    l.type === 'ИН' ? 't-IN' :
    l.type === 'Г'  ? 't-G'  : 't-X';
  return `
  <div class="card student">
    <div class="student-top">
      <span class="tb ${tClass}">${escapeHtml(l.type || '—')}</span>
      <span class="lesson-date">${escapeHtml(l.date || 'без даты')}</span>
      ${saved ? `<span class="chip">в Sheets: ${escapeHtml(saved)}</span>` : ''}
      ${statusChip}
    </div>
    <div class="grades">
      ${['2','3','4','5'].map(g =>
        `<button class="grade-btn g${g} ${pendingVal === g ? 'active' : ''}"
          onclick="tapGrade(${l.index},'${g}')">${g}</button>`).join('')}
    </div>
  </div>`;
}
function renderStudent(){
  const g = state.group;
  const s = state.data?.students?.[state.studentIdx];
  if(!s){ renderStudents(); return; }

  const sum = studentSummary(state.studentIdx);
  const lessons = [...state.data.lessons]
    .reverse() // последние занятия сверху
    .filter(l => !isLocked(l.type, s.subgroup));

  const avgColor =
    sum.avg >= 4.5 ? 'var(--accent)' :
    sum.avg >= 3.5 ? 'var(--blue)' :
    sum.avg >= 2.5 ? 'var(--yellow)' :
    sum.avg > 0 ? 'var(--red)' : 'var(--muted)';

  $app.innerHTML = `
    <div class="group-head">
      <button class="icon-btn" onclick="backToStudents()">←</button>
      <div style="flex:1;min-width:0">
        <div class="screen-title small">${escapeHtml(s.surname)} ${escapeHtml(s.name)}</div>
        <div class="header-sub">${escapeHtml(g.group)} · ${relevantLabel(s)}</div>
      </div>
      ${subBadge(s.subgroup)}
    </div>
    <div class="stats-row">
      <div class="stat-mini"><div class="v">${sum.total}</div><div class="k">занятий</div></div>
      <div class="stat-mini"><div class="v">${sum.graded}</div><div class="k">оценок</div></div>
      <div class="stat-mini"><div class="v" style="color:${avgColor}">${sum.avg ? sum.avg.toFixed(2) : '—'}</div><div class="k">ср. балл</div></div>
      <div class="stat-mini"><div class="v" style="color:${sum.abs ? 'var(--red)' : 'var(--muted)'}">${sum.abs}</div><div class="k">пропуски</div></div>
    </div>
    <div class="students">
      ${lessons.map(l => lessonHTML(l, state.studentIdx)).join('')}
      ${lessons.length === 0 ? '<div class="empty">Занятий пока нет</div>' : ''}
    </div>`;
}

/* --- панель отправки --- */
function renderSendbar(){
  const bar = document.getElementById('sendbar');
  const visible = isConfigured() && state.screen === 'student' &&
    state.data && state.studentIdx >= 0;
  bar.style.display = visible ? 'flex' : 'none';
  if(!visible) return;
  const n = currentDrafts().length;
  const s = state.data.students[state.studentIdx];
  document.getElementById('send-info').textContent =
    n ? `${s.surname}: черновиков — ${n}` : 'Оценки можно редактировать и во время отправки очереди';
  const btn = document.getElementById('send-btn');
  btn.disabled = n === 0 || state.sending || !state.storageReady;
  btn.textContent = state.sending ? 'Сохранение в браузере…' : `Отправить в очередь${n ? ` (${n})` : ''}`;
}

/* ---------- старт ---------- */
window.addEventListener('DOMContentLoaded', async () => {
  if(!isConfigured()){ render(); return; }
  try {
    await openStorage();
    await reloadLocalStorage();
    state.storageReady = true;
    if(navigator.storage?.persist) navigator.storage.persist().catch(() => {});
    scheduleSync(0);
  } catch(error) { reportStorageError(error); }
  renderSyncStatus();
  loadGroups();
});
window.addEventListener('online', () => { renderSyncStatus(); scheduleSync(0); });
window.addEventListener('offline', () => renderSyncStatus());
document.addEventListener('visibilitychange', () => {
  if(!document.hidden) scheduleSync(0);
});
setInterval(() => { if(state.storageReady && buildNextBatch()) scheduleSync(0); }, 30000);
</script>
</body>
</html>
